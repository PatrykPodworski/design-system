name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release tag's registry.json pins its dependencies to the tag (pnpm release).
      - run: pnpm registry:check ${REF:+--ref "$REF"}
        env:
          REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
